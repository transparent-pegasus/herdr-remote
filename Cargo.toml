[package]
name = "herdr-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tower-http = { version = "0.7.0", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
